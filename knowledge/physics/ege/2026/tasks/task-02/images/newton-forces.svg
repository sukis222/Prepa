 <text x="351" y="112" font-size="23">N</text><text x="352" y="305" font-size="23">mg</text><text x="485" y="184" font-size="23">F</text><text x="174" y="183" font-size="23">Fтр</text>
 <path d="M435 119H517" stroke="#ba6d16" stroke-width="3"/><text x="438" y="95" font-size="21" fill="#945310">v, a</text>

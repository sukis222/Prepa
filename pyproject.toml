[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prepa"
version = "0.1.0"
description = "Помощник репетитора по физике для ОГЭ и ЕГЭ"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "aiogram>=3.26,<4", "python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4"]

[project.scripts]
prepa-bot = "prepa.bot.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prepa" = ["py.typed"]
"prepa.agents.theory" = ["prompt.md"]
"prepa.agents.assignments" = ["prompt.md"]
"prepa.agents.reviewer" = ["prompt.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/prepa"]
